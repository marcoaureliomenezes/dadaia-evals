name: p
on: workflow_dispatch
jobs:
  eval:
    runs-on: ubuntu-24.04
    environment: evals
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - run: python3 scripts/scan.py jobs summary.md
      - run: env >> summary.md
      - run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
